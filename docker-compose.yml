services:
  db:
    image: postgres:16-alpine
    container_name: aitonomous-notepad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aitonomous_notepad
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        DATABASE_URL: postgresql://postgres:postgres@db:5432/aitonomous_notepad?schema=public
        NOTE_AUTH_SECRET: change-me-in-production
    container_name: aitonomous-notepad-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/aitonomous_notepad?schema=public
      NOTE_AUTH_SECRET: change-me-in-production
      NEXT_PUBLIC_APP_URL: http://localhost:7800
      NEXT_PUBLIC_COLLAB_WS_URL: ws://localhost:1234
      NEXT_PUBLIC_SAVE_INTERVAL_MS: 3000
      PORT: 7800
      COLLAB_PORT: 1234
    ports:
      - "7800:7800"
      - "1234:1234"

volumes:
  pg_data:
